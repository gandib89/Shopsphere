<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)"/>
  <!-- Shopping bag icon -->
  <g fill="white" stroke="white" stroke-width="2">
    <!-- Bag body -->
    <path d="M 30 35 L 25 70 Q 25 75 30 75 L 70 75 Q 75 75 75 70 L 70 35 Z" fill="white" stroke="none"/>
    <!-- Bag handles -->
    <path d="M 38 35 Q 38 25 50 25 Q 62 25 62 35" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <!-- Bag top line -->
    <line x1="30" y1="35" x2="70" y2="35" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
