server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 6m;

  # "backend" only resolves inside docker-compose's network. Standalone deployments (e.g. Cloud
  # Run, where VITE_BACKEND_URL points the built JS straight at the backend's own URL) never hit
  # these routes, but nginx still resolves proxy_pass targets at config-load time by default and
  # would refuse to start if the host doesn't exist. Resolving it as a variable instead defers
  # the lookup to request time, so nginx boots fine either way.
  resolver 127.0.0.11 8.8.8.8 valid=30s ipv6=off;

  location /api/ {
    set $backend_upstream http://backend:4000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    set $backend_upstream http://backend:4000;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
}
