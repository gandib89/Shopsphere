services:
  keycloak-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: keycloak
    expose:
      - "5432"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    restart: unless-stopped
    command: start --import-realm --http-enabled=true --hostname-strict=false
    depends_on:
      - keycloak-postgres
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?set KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      MCP_WORKLOAD_CLIENT_SECRET: ${MCP_WORKLOAD_CLIENT_SECRET:?set MCP_WORKLOAD_CLIENT_SECRET}
      ASSISTANT_OAUTH_CLIENT_SECRET: ${ASSISTANT_OAUTH_CLIENT_SECRET:?set ASSISTANT_OAUTH_CLIENT_SECRET}
      KEYCLOAK_SYNC_CLIENT_SECRET: ${KEYCLOAK_SYNC_CLIENT_SECRET:?set KEYCLOAK_SYNC_CLIENT_SECRET}
    volumes:
      - ./infra/keycloak/realm-shopsphere.json:/opt/keycloak/data/import/realm-shopsphere.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopsphere
      POSTGRES_PASSWORD: shopsphere
      POSTGRES_DB: shopsphere
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopsphere"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly yes
    expose:
      - "6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # backend/config/config.env is gitignored — copy it from config.env.example first
    # (see README's Local Development section). DATABASE_URL below intentionally overrides
    # whatever's in that file: containers reach Postgres by service name, not localhost.
    env_file:
      - ./backend/config/config.env
    environment:
      DATABASE_URL: postgresql://shopsphere:shopsphere@postgres:5432/shopsphere?schema=public
      ASSISTANT_DATABASE_URL: postgresql://shopsphere_assistant_runtime:${ASSISTANT_DB_PASSWORD:?set ASSISTANT_DB_PASSWORD}@postgres:5432/shopsphere?schema=public
      ASSISTANT_PRIVATE_DATABASE_URL: postgresql://shopsphere_assistant_private_runtime:${ASSISTANT_PRIVATE_DB_PASSWORD:?set ASSISTANT_PRIVATE_DB_PASSWORD}@postgres:5432/shopsphere?schema=public
      ASSISTANT_DB_PASSWORD: ${ASSISTANT_DB_PASSWORD:?set ASSISTANT_DB_PASSWORD}
      ASSISTANT_PRIVATE_DB_PASSWORD: ${ASSISTANT_PRIVATE_DB_PASSWORD:?set ASSISTANT_PRIVATE_DB_PASSWORD}
      ASSISTANT_API_TOKEN: ${ASSISTANT_API_TOKEN:?set ASSISTANT_API_TOKEN}
      ASSISTANT_CURSOR_SECRET: ${ASSISTANT_CURSOR_SECRET:?set ASSISTANT_CURSOR_SECRET}
      REDIS_URL: redis://redis:6379
      MCP_OAUTH_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/shopsphere
      MCP_OAUTH_JWKS_URI: http://keycloak:8080/realms/shopsphere/protocol/openid-connect/certs
      MCP_OAUTH_INTROSPECTION_ENDPOINT: http://keycloak:8080/realms/shopsphere/protocol/openid-connect/token/introspect
      MCP_OAUTH_INTROSPECTION_CLIENT_ID: shopsphere-assistant-api
      MCP_OAUTH_INTROSPECTION_CLIENT_SECRET: ${ASSISTANT_OAUTH_CLIENT_SECRET:?set ASSISTANT_OAUTH_CLIENT_SECRET}
      MCP_WORKLOAD_CLIENT_ID: shopsphere-mcp-workload
      KEYCLOAK_ADMIN_ORIGIN: http://keycloak:8080
      KEYCLOAK_SYNC_CLIENT_ID: shopsphere-account-sync
      KEYCLOAK_SYNC_CLIENT_SECRET: ${KEYCLOAK_SYNC_CLIENT_SECRET:?set KEYCLOAK_SYNC_CLIENT_SECRET}
      MCP_CLIENT_REDIRECT_URIS: ${MCP_CLIENT_REDIRECT_URIS:-http://localhost:6274/oauth/callback}
      MCP_TOOL_GET_MY_PROFILE_SUMMARY_ENABLED: ${MCP_TOOL_GET_MY_PROFILE_SUMMARY_ENABLED:-false}
      MCP_TOOL_LIST_ORDER_EXCEPTION_QUEUE_ENABLED: ${MCP_TOOL_LIST_ORDER_EXCEPTION_QUEUE_ENABLED:-false}
      MCP_TOOL_GET_ORDER_EXCEPTION_DETAIL_ENABLED: ${MCP_TOOL_GET_ORDER_EXCEPTION_DETAIL_ENABLED:-false}
      MCP_TOOL_LIST_RETURN_QUEUE_ENABLED: ${MCP_TOOL_LIST_RETURN_QUEUE_ENABLED:-false}
      PORT: 4000
      NODE_ENV: production
      PAYMENT_MODE: ${PAYMENT_MODE:-sandbox}
      SANDBOX_REFUND_OUTCOME: ${SANDBOX_REFUND_OUTCOME:-success}
    expose:
      - "4000"
    volumes:
      - backend_uploads:/app/uploads

  mcp:
    build: ./mcp
    restart: unless-stopped
    depends_on:
      - backend
      - redis
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 4100
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-http://localhost:5173}
      MCP_BACKEND_ORIGIN: http://backend:4000
      ASSISTANT_API_TOKEN: ${ASSISTANT_API_TOKEN:?set ASSISTANT_API_TOKEN}
      MCP_OAUTH_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/shopsphere
      MCP_OAUTH_JWKS_URI: http://keycloak:8080/realms/shopsphere/protocol/openid-connect/certs
      MCP_OAUTH_TOKEN_ENDPOINT: http://keycloak:8080/realms/shopsphere/protocol/openid-connect/token
      MCP_OAUTH_INTROSPECTION_ENDPOINT: http://keycloak:8080/realms/shopsphere/protocol/openid-connect/token/introspect
      MCP_OAUTH_AUDIENCE: shopsphere-mcp
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-http://localhost:4100/mcp}
      MCP_OAUTH_CLIENTS: shopsphere-mcp-client
      MCP_WORKLOAD_CLIENT_ID: shopsphere-mcp-workload
      MCP_WORKLOAD_CLIENT_SECRET: ${MCP_WORKLOAD_CLIENT_SECRET:?set MCP_WORKLOAD_CLIENT_SECRET}
      ASSISTANT_AUDIENCE: shopsphere-assistant-api
      REDIS_URL: redis://redis:6379
      MCP_TOOL_GET_CAPABILITIES_ENABLED: ${MCP_TOOL_GET_CAPABILITIES_ENABLED:-false}
      MCP_TOOL_GET_MY_PROFILE_SUMMARY_ENABLED: ${MCP_TOOL_GET_MY_PROFILE_SUMMARY_ENABLED:-false}
      MCP_TOOL_LIST_MY_NOTIFICATIONS_ENABLED: ${MCP_TOOL_LIST_MY_NOTIFICATIONS_ENABLED:-false}
      MCP_TOOL_GET_STORE_POLICY_ENABLED: ${MCP_TOOL_GET_STORE_POLICY_ENABLED:-false}
      MCP_TOOL_SEARCH_PRODUCTS_ENABLED: ${MCP_TOOL_SEARCH_PRODUCTS_ENABLED:-false}
      MCP_TOOL_COMPARE_PRODUCTS_ENABLED: ${MCP_TOOL_COMPARE_PRODUCTS_ENABLED:-false}
      MCP_TOOL_GET_PRODUCT_ENABLED: ${MCP_TOOL_GET_PRODUCT_ENABLED:-false}
      MCP_TOOL_GET_PRODUCT_REVIEWS_ENABLED: ${MCP_TOOL_GET_PRODUCT_REVIEWS_ENABLED:-false}
      MCP_TOOL_GET_RECOMMENDATIONS_ENABLED: ${MCP_TOOL_GET_RECOMMENDATIONS_ENABLED:-false}
      MCP_TOOL_GET_MY_CART_ENABLED: ${MCP_TOOL_GET_MY_CART_ENABLED:-false}
      MCP_TOOL_VALIDATE_PROMO_CODE_ENABLED: ${MCP_TOOL_VALIDATE_PROMO_CODE_ENABLED:-false}
      MCP_TOOL_PREVIEW_CHECKOUT_ENABLED: ${MCP_TOOL_PREVIEW_CHECKOUT_ENABLED:-false}
      MCP_TOOL_LIST_MY_ORDERS_ENABLED: ${MCP_TOOL_LIST_MY_ORDERS_ENABLED:-false}
      MCP_TOOL_GET_MY_ORDER_ENABLED: ${MCP_TOOL_GET_MY_ORDER_ENABLED:-false}
      MCP_TOOL_TRACK_MY_ORDER_ENABLED: ${MCP_TOOL_TRACK_MY_ORDER_ENABLED:-false}
      MCP_TOOL_GET_MY_BILL_SUMMARY_ENABLED: ${MCP_TOOL_GET_MY_BILL_SUMMARY_ENABLED:-false}
      MCP_TOOL_GET_MY_PAYMENT_STATUS_ENABLED: ${MCP_TOOL_GET_MY_PAYMENT_STATUS_ENABLED:-false}
      MCP_TOOL_LIST_MY_PRODUCTS_ENABLED: ${MCP_TOOL_LIST_MY_PRODUCTS_ENABLED:-false}
      MCP_TOOL_GET_MY_PRODUCT_ENABLED: ${MCP_TOOL_GET_MY_PRODUCT_ENABLED:-false}
      MCP_TOOL_GET_MY_INVENTORY_SUMMARY_ENABLED: ${MCP_TOOL_GET_MY_INVENTORY_SUMMARY_ENABLED:-false}
      MCP_TOOL_LIST_MY_SELLER_ORDERS_ENABLED: ${MCP_TOOL_LIST_MY_SELLER_ORDERS_ENABLED:-false}
      MCP_TOOL_GET_MY_SELLER_ORDER_ENABLED: ${MCP_TOOL_GET_MY_SELLER_ORDER_ENABLED:-false}
      MCP_TOOL_GET_MY_REVENUE_SUMMARY_ENABLED: ${MCP_TOOL_GET_MY_REVENUE_SUMMARY_ENABLED:-false}
      MCP_TOOL_LIST_ORDER_EXCEPTION_QUEUE_ENABLED: ${MCP_TOOL_LIST_ORDER_EXCEPTION_QUEUE_ENABLED:-false}
      MCP_TOOL_GET_ORDER_EXCEPTION_DETAIL_ENABLED: ${MCP_TOOL_GET_ORDER_EXCEPTION_DETAIL_ENABLED:-false}
      MCP_TOOL_LIST_RETURN_QUEUE_ENABLED: ${MCP_TOOL_LIST_RETURN_QUEUE_ENABLED:-false}
      MCP_BACKEND_TIMEOUT_MS: 10000
      MCP_REQUESTS_PER_MINUTE: 60
      MCP_MAX_CONCURRENCY: 4
      MCP_MAX_REQUEST_BYTES: 32768
      MCP_MAX_RESPONSE_BYTES: 65536
    ports:
      - "${MCP_PORT:-4100}:4100"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-true}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  keycloak_postgres_data:
  backend_uploads:
  redis_data:
